# Render Blueprint — two services: FastAPI backend + static Vite/React frontend.
# Deploy via Render UI: New → Blueprint → pick this repo. (Manual steps also in DEPLOY.md.)
#
# Which requirements file? requirements-api.txt has everything the API needs to RUN.
# requirements.txt is the EDA/feature PIPELINE (libpysal+esda+scipy+matplotlib+gdown+…) and is
# NOT needed in the cloud — don't install it (heavy/slow, unused at runtime).
# requirements-ai.txt is just the `anthropic` SDK for the optional AI copilot (installed below).
services:
  # ---------- Backend API (FastAPI) ----------
  - type: web
    name: gridlock-api
    runtime: python
    region: singapore          # closest Render region to Bengaluru
    plan: free
    buildCommand: pip install -r requirements-api.txt -r requirements-ai.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SCORES_PARQUET
        value: srv_data/cell_scores.parquet
      - key: IMPACT_MODEL
        value: srv_data/model_impact.txt
      - key: RCP_CSV
        value: srv_data/rcp.csv
      - key: CORS_ORIGINS
        value: "*"             # public demo; tighten to the frontend URL if desired
      # --- Live MapMyIndia routing (optional). Set the key in the dashboard to get road-accurate
      #     routes/drive-times; without it routing falls back to estimates (everything still works). ---
      - key: MAPPLS_KEY
        sync: false
      # --- AI copilot (optional). The local Claude proxy isn't reachable from the cloud, so to
      #     enable the copilot here set AI_API_KEY to a real Anthropic API key in the dashboard.
      #     Without a valid key the AI surfaces show "offline"; every other feature works. ---
      - key: AI_ENABLED
        value: "1"
      - key: AI_BASE_URL
        value: https://api.anthropic.com
      - key: AI_MODEL
        value: claude-sonnet-4-6
      - key: AI_API_KEY
        sync: false

  # ---------- Frontend (static Vite build) ----------
  - type: web
    name: gridlock-web
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_BASE
        # the backend's public URL (the live gridlock-api service).
        value: https://gridlock-api-mook.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
